name: Live GitHub acceptance

# Runs RepoVibe in real Chromium against the real, public github.com (logged out, no credentials).
# Kept separate from the deterministic offline CI so GitHub UI changes or rate limits never block it.
# Access refusals (403/429, login redirects, challenges, missing GitHub assets) are reported as BLOCKED
# (skipped), never bypassed and never counted as passes.

on:
  pull_request:
    paths:
      - 'content.js'
      - 'shared/**'
      - 'popup.*'
      - 'studio.*'
      - 'ui.css'
      - 'manifest.json'
      - 'tests/live/**'
      - 'tests/e2e/helpers.js'
      - 'package*.json'
      - '.github/workflows/live-github.yml'
  schedule:
    - cron: '23 4 * * 1'   # weekly, Monday 04:23 UTC, to catch GitHub UI changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-github-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Live github.com acceptance (Chromium + extension)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Probe github.com reachability (unauthenticated)
        run: |
          {
            echo "## github.com reachability from this runner"
            echo ""
            echo "| URL | HTTP status |"
            echo "|---|---|"
            for url in https://github.com/actions/checkout https://github.com/actions/checkout/issues https://github.githubassets.com/favicons/favicon.svg; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 RepoVibe-acceptance-tests' "$url" || echo "error")
              echo "| $url | $code |"
            done
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Live acceptance tests
        run: npm run test:live

      - name: Upload screenshots, results and failure dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-github-results
          path: tests/live/output/
          if-no-files-found: ignore

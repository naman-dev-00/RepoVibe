name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check, unit, E2E, package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: E2E tests (Chromium + unpacked extension, offline GitHub fixture)
        run: npm run test:e2e

      - name: Build extension ZIP
        run: npm run package

      - name: Verify extension ZIP
        run: npm run verify:package

      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output
          path: tests/e2e/output/
          if-no-files-found: ignore

      - name: Upload extension ZIP
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: RepoVibe-Extension
          path: RepoVibe-Extension.zip

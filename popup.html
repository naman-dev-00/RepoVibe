<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>RepoVibe</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="popup-page">
  <div class="popup-app">
    <header class="popup-header">
      <div class="brandmark">R<span>✦</span></div>
      <div class="brand-title"><b>RepoVibe</b><small>Make every repo your own</small></div>
      <label class="switch" title="Enable RepoVibe"><input id="enabled" type="checkbox" checked /><span></span></label>
    </header>
    <section class="repo-panel">
      <div class="eyebrow"><span class="live-dot"></span> CUSTOMIZING</div>
      <h2 id="repoName">Detecting GitHub…</h2>
      <p id="activeTheme">Loading theme…</p>
      <div class="scope-chip" id="scopeInfo">Local theme engine</div>
    </section>
    <section class="popup-section">
      <div class="section-top"><h3>Change theme</h3><span>Pick your vibe</span></div>
      <div class="scope-controls" role="group" aria-label="Apply theme to">
        <label><input type="radio" name="scope" value="repository" checked /> This repo</label>
        <label><input type="radio" name="scope" value="global" /> Everywhere</label>
      </div>
      <div id="quickThemes" class="quick-themes"></div>
      <div class="section-top motion-top"><h3>Live wallpaper</h3><span id="motionNote">Ambient motion</span></div>
      <div class="scope-controls" role="radiogroup" aria-label="Live wallpaper motion">
        <label title="No animation"><input type="radio" name="motion" value="static" /> Static</label>
        <label title="Gentle ambient motion (default)"><input type="radio" name="motion" value="ambient" checked /> Ambient</label>
        <label title="Stronger motion and slow parallax"><input type="radio" name="motion" value="cinematic" /> Cinematic</label>
      </div>
    </section>
    <section class="popup-actions">
      <button class="primary-button" id="openStudio">✦ Customize this repository <span>↗</span></button>
      <div class="popup-row"><button class="subtle-button" id="resetRepo" title="Remove your choice; the repository returns to its automatic or inherited theme">↺ Reset repository theme</button><button class="subtle-button" id="resetCurrent" title="Show original GitHub styling here">◌ Restore GitHub appearance</button></div>
      <p id="status" class="inline-status" role="status"></p>
    </section>
    <footer class="popup-footer"><span>PRIVACY-FIRST · LOCAL ONLY</span><span>v0.2.0</span></footer>
  </div>
  <script src="shared/wallpaper-catalog.js"></script><script src="shared/core.js"></script><script src="popup.js"></script>
</body>
</html>
